<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>أدويتي</title>
  
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/pill.png">

  <style>
    :root {
      --primary: #007aff;
      --success: #34c759;
      --bg: #f2f2f7; 
      --card-bg: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 20px 15px;
      color: #1c1c1e;
      overflow-x: hidden;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    header {
      text-align: right;
      margin-bottom: 25px;
      padding-right: 10px;
    }

    h1 {
      font-size: 2rem;
      margin: 0;
      color: #000;
      font-weight: 800;
    }

    .date-badge {
      font-size: 1rem;
      color: #8e8e93;
      font-weight: 500;
      text-transform: capitalize;
    }

    /* تصميم القائمة الجديد */
    .med-list-container {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .med-row {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 0.5px solid #e5e5ea;
      transition: all 0.2s ease;
      gap: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .med-row:active {
      background-color: #f2f2f7;
    }

    .med-row:last-child { border-bottom: none; }

    .med-row.taken {
      background: #fafafa;
    }

    .med-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .med-info {
      flex-grow: 1;
      min-width: 0;
    }

    .med-info strong {
      display: block;
      font-size: 1.05rem;
      color: #000;
      margin-bottom: 2px;
    }

    .med-row.taken .med-info strong {
      text-decoration: line-through;
      color: #8e8e93;
    }

    .med-info span {
      font-size: 0.85rem;
      color: #8e8e93;
      display: block;
    }

    .time-status {
      font-size: 0.75rem;
      color: var(--primary);
      background: #e8f0ff;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    /* زر الصح الدائري */
    .check-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #d1d1d6;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .taken .check-circle {
      background: var(--success);
      border-color: var(--success);
      transform: scale(1.1);
    }

    .check-circle svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: white;
      stroke-width: 3.5;
      display: none;
    }

    .taken .check-circle svg { display: block; }

    body::-webkit-scrollbar { display: none; }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <div class="date-badge" id="current-date"></div>
      <h1>أدويتي اليومية</h1>
    </header>

    <div class="med-list-container" id="med-list">
      </div>
  </div>

  <audio id="ding-sound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const medications = [
      { id: "Sugar-AM", name: "فورميت (سكر)", instructions: "1 حبة - صباحاً", icon: "📉", color: "#fff4e6" },
      { id: "Empa-25", name: "إمباجليفلوزين اس بي سي", instructions: "1 حبة (25 ملجم) - مرة يومياً", icon: "💊", color: "#f0e8ff" },
          { id: "Immune-AM", name: "سيليسيبت (مناعة)", instructions: "2 حبة - صباحاً", icon: "🛡️", color: "#e8f0ff" },
      { id: "Omega3", name: "أوميجا 3", instructions: "1 حبة - وسط الأكل", icon: "🐟", color: "#fff9db" },
      { id: "VitaminD", name: "فيتامين د", instructions: "1 حبة - يومياً", icon: "☀️", color: "#e8ffe8" },
      { id: "Immune-PM", name: "سيليسيبت (مناعة)", instructions: "2 حبة - مساءً", icon: "🛡️", color: "#ffe8f0" },
      { id: "Sugar-PM", name: "فورميت (سكر)", instructions: "1 حبة - مساءً", icon: "📉", color: "#e6f7ff" }
    ];

    function updateDate() {
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById("current-date").textContent = now.toLocaleDateString("ar-EG", options);
    }

    function render() {
      const status = JSON.parse(localStorage.getItem("medStatus") || "{}");
      const times = JSON.parse(localStorage.getItem("medTimes") || "{}");
      const listDiv = document.getElementById("med-list");
      
      listDiv.innerHTML = medications.map(med => {
        const isTaken = status[med.id];
        return `
          <div class="med-row ${isTaken ? 'taken' : ''}" onclick="toggle('${med.id}')">
            <div class="check-circle">
              <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
            <div class="med-icon-box" style="background:${med.color}">${med.icon}</div>
            <div class="med-info">
              <strong>${med.name}</strong>
              <span>${med.instructions}</span>
            </div>
            ${isTaken ? `<div class="time-status">${times[med.id]}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function toggle(id) {
      const status = JSON.parse(localStorage.getItem("medStatus") || "{}");
      const times = JSON.parse(localStorage.getItem("medTimes") || "{}");
      
      status[id] = !status[id];
      if(status[id]) {
        times[id] = new Date().toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' });
        document.getElementById("ding-sound").play().catch(() => {});
      } else {
        delete times[id];
      }
      
      localStorage.setItem("medStatus", JSON.stringify(status));
      localStorage.setItem("medTimes", JSON.stringify(times));
      render();
    }

    updateDate();
    render();
  </script>
</body>
</html>
