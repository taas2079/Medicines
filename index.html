<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة الأدوية - iOS Style</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
            background: linear-gradient(180deg, #f6f9fc, #eef3f8);
            margin: 0;
            padding: 25px;
            color: #1c1c1e;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: rgba(255,255,255,0.75);
            padding: 30px;
            border-radius: 28px;
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }

        h1 {
            text-align: center;
            color: #007aff;
            margin-bottom: 10px;
            font-size: 2.2em;
            font-weight: 700;
        }

        h2 {
            margin-top: 25px;
            color: #5c6b7a;
            font-size: 1.2em;
            font-weight: 600;
        }

        .date-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .date-label {
            font-size: 1em;
            color: #5c6b7a;
        }

        .clock {
            font-size: 0.95em;
            color: #007aff;
        }

        .med-entry {
            display: grid;
            grid-template-columns: 45px 1fr 1.5fr auto;
            gap: 12px;
            padding: 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.9);
            border: 1px solid #e3e9f1;
            margin-bottom: 15px;
            transition: 0.25s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            align-items: center;
        }

        .med-entry:hover {
            transform: translateY(-3px);
            background: #f9fbff;
        }

        .med-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .med-icon img {
            width: 28px;
            height: 28px;
        }

        .med-entry strong {
            font-size: 1.05em;
            color: #1c1c1e;
        }

        .med-entry span {
            font-size: 0.95em;
            color: #4a4a4a;
        }

        .med-entry.taken strong,
        .med-entry.taken span {
            text-decoration: line-through;
            color: #c62828;
        }

        .log-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            font-weight: 600;
            font-size: 0.95em;
            transition: 0.2s;
            min-width: 110px;
        }

        .taken-btn { background-color: #34c759; }
        .not-taken-btn { background-color: #8e8e93; }

        .log-btn:active {
            transform: scale(0.96);
        }

        .time-log {
            grid-column: 1 / 5;
            font-size: 0.85em;
            color: #007aff;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .med-entry {
                grid-template-columns: 45px 1fr;
            }
            .time-log {
                grid-column: 1 / 3;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💊 متابعة جرعات الأدوية</h1>

    <div class="date-row">
        <div class="date-label">🗓️ <span id="current-date"></span></div>
        <div class="clock" id="current-time"></div>
    </div>

    <h2>قائمة الأدوية اليوم</h2>

    <div id="med-list"></div>

</div>

<audio id="ding-sound" preload="auto">
    <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
</audio>

<script>
    const dateDisplay = document.getElementById("current-date");
    const timeDisplay = document.getElementById("current-time");
    const medListDiv = document.getElementById("med-list");
    const dingSound = document.getElementById("ding-sound");

    const STORAGE_STATUS = "fixedMedStatus";
    const STORAGE_TIMES = "fixedMedTimes";

    const medications = [
        { 
            id: "Immune-AM", 
            name: "دواء المناعة", 
            instructions: "حبتين صباحاً قبل الأكل",
            icon: "https://img.icons8.com/color/48/pill.png",
            color: "#e8f0ff"
        },
        { 
            id: "Sugar-AM", 
            name: "منظم السكر", 
            instructions: "حبة صباحاً مع الأكل",
            icon: "https://img.icons8.com/color/48/insulin-pen.png",
            color: "#fff4e6"
        },
        { 
            id: "VitaminD", 
            name: "فيتامين د", 
            instructions: "حبة بعد الأكل يومياً",
            icon: "https://img.icons8.com/color/48/vitamin-d.png",
            color: "#e8ffe8"
        },
        { 
            id: "Immune-PM", 
            name: "دواء المناعة", 
            instructions: "حبتين مساءً قبل الأكل",
            icon: "https://img.icons8.com/color/48/pill.png",
            color: "#ffe8f0"
        },
        { 
            id: "Sugar-PM", 
            name: "منظم السكر", 
            instructions: "حبة مساءً مع الأكل",
            icon: "https://img.icons8.com/color/48/insulin-pen.png",
            color: "#e6f7ff"
        }
    ];

    function updateClock() {
        const now = new Date();
        const dateOptions = { year: "numeric", month: "long", day: "numeric", weekday: "long" };
        dateDisplay.textContent = now.toLocaleDateString("ar-EG", dateOptions);
        timeDisplay.textContent = now.toLocaleTimeString("ar-EG");
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loadStatus() {
        const stored = localStorage.getItem(STORAGE_STATUS);
        return stored ? JSON.parse(stored) : {};
    }

    function saveStatus(obj) {
        localStorage.setItem(STORAGE_STATUS, JSON.stringify(obj));
    }

    function loadTimes() {
        const stored = localStorage.getItem(STORAGE_TIMES);
        return stored ? JSON.parse(stored) : {};
    }

    function saveTimes(obj) {
        localStorage.setItem(STORAGE_TIMES, JSON.stringify(obj));
    }

    function renderMedications() {
        const status = loadStatus();
        const times = loadTimes();

        medListDiv.innerHTML = "";

        medications.forEach(med => {
            const isTaken = status[med.id] || false;
            const time = times[med.id] || "";

            const entry = document.createElement("div");
            entry.className = "med-entry" + (isTaken ? " taken" : "");

            entry.innerHTML = `
                <div class="med-icon" style="background:${med.color}">
                    <img src="${med.icon}">
                </div>

                <strong>${med.name}</strong>
                <span>${med.instructions}</span>

                <button class="log-btn ${isTaken ? "taken-btn" : "not-taken-btn"}"
                        onclick="toggleTaken('${med.id}')">
                    ${isTaken ? "تم التناول" : "لم يتناول"}
                </button>

                <div class="time-log">${time ? "⏱ تم التسجيل في: " + time : ""}</div>
            `;

            medListDiv.appendChild(entry);
        });
    }

    function toggleTaken(id) {
        const status = loadStatus();
        const times = loadTimes();

        const newState = !status[id];
        status[id] = newState;
        saveStatus(status);

        if (newState) {
            const now = new Date();
            const formatted = now.toLocaleTimeString("ar-EG");
            times[id] = formatted;
            saveTimes(times);

            dingSound.currentTime = 0;
            dingSound.play().catch(() => {});
        } else {
            delete times[id];
            saveTimes(times);
        }

        renderMedications();
    }

    renderMedications();
</script>

</body>
</html>
