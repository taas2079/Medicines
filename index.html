<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام متابعة الأدوية الذكي</title>

  <style>
    :root {
      --primary: #007aff;
      --success: #34c759;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 20px;
      color: #2d3436;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 30px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.05);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: var(--primary);
      font-size: 2.2em;
      margin-bottom: 5px;
    }

    .date-badge {
      display: inline-block;
      padding: 8px 20px;
      background: #eef2f7;
      border-radius: 50px;
      font-weight: 600;
      color: #5c6b7a;
      font-size: 0.9em;
    }

    /* تصميم الجدول المطور */
    .med-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
      margin-top: 20px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 3fr 2fr 2fr;
      padding: 10px 20px;
      font-weight: bold;
      color: #8e8e93;
      font-size: 0.9em;
    }

    .med-row {
      display: grid;
      grid-template-columns: 3fr 2fr 2fr;
      align-items: center;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 20px;
      border: 1px solid #edf2f7;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }

    .med-row.taken {
      background: #f0fff4;
      border-color: var(--success);
      transform: scale(0.98);
    }

    /* تفاصيل الدواء */
    .med-main {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .med-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: 0.3s;
    }

    .med-info strong {
      display: block;
      font-size: 1.1em;
      transition: 0.3s;
    }

    .med-row.taken .med-info strong {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .med-info span {
      font-size: 0.85em;
      color: #718096;
    }

    /* التوقيت والحالة */
    .med-time-status {
      text-align: center;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.9em;
    }

    .action-area {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    /* الزر المحسن */
    .check-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid #cbd5e0;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .med-row.taken .check-btn {
      background: var(--success);
      border-color: var(--success);
      color: white;
      box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
    }

    .check-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 3;
      display: none;
    }

    .med-row.taken .check-btn svg {
      display: block;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .table-header { display: none; }
      .med-row {
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      .med-time-status { grid-column: 1 / 3; text-align: right; padding-right: 65px; border-top: 1px solid #eee; padding-top: 5px; margin-top: 5px;}
    }

    /* انيميشن الاهتزاز */
    .shake { animation: shakeAnim 0.4s ease-in-out; }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <h1>💊 جدول الأدوية اليومي</h1>
      <div class="date-badge">
        🗓️ <span id="current-date"></span> | 🕒 <span id="current-time"></span>
      </div>
    </header>

    <div class="table-header">
      <div>الدواء والجرعة</div>
      <div style="text-align: center;">وقت التناول</div>
      <div style="text-align: flex-end;">الحالة</div>
    </div>

    <div id="med-list"></div>
  </div>

  <audio id="ding-sound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const dateDisplay = document.getElementById("current-date");
    const timeDisplay = document.getElementById("current-time");
    const medListDiv = document.getElementById("med-list");
    const dingSound = document.getElementById("ding-sound");

    const STORAGE_STATUS = "fixedMedStatus_v2";
    const STORAGE_TIMES = "fixedMedTimes_v2";

    // قائمة الأدوية المحدثة مع أوميجا 3
    const medications = [
      { id: "Immune-AM", name: "دواء المناعة - سيليسيبت", instructions: "حبتين صباحاً قبل الأكل", icon: "🛡️", color: "#e8f0ff" },
      { id: "Sugar-AM", name: "منظم السكر - فورميت", instructions: "حبة صباحاً مع الأكل", icon: "📉", color: "#fff4e6" },
      { id: "Omega3", name: "أوميجا 3 (زيت السمك)", instructions: "حبة واحدة وسط الأكل", icon: "🐟", color: "#fff9db" },
      { id: "VitaminD", name: "فيتامين د", instructions: "حبة بعد الأكل يومياً", icon: "☀️", color: "#e8ffe8" },
      { id: "Immune-PM", name: "دواء المناعة - سيليسيبت", instructions: "حبتين مساءً قبل الأكل", icon: "🛡️", color: "#ffe8f0" },
      { id: "Sugar-PM", name: "منظم السكر - فورميت", instructions: "حبة مساءً مع الأكل", icon: "📉", color: "#e6f7ff" }
    ];

    function updateClock() {
      const now = new Date();
      dateDisplay.textContent = now.toLocaleDateString("ar-EG", { weekday: 'long', day: 'numeric', month: 'long' });
      timeDisplay.textContent = now.toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loadStatus() { return JSON.parse(localStorage.getItem(STORAGE_STATUS) || "{}"); }
    function saveStatus(obj) { localStorage.setItem(STORAGE_STATUS, JSON.stringify(obj)); }
    function loadTimes() { return JSON.parse(localStorage.getItem(STORAGE_TIMES) || "{}"); }
    function saveTimes(obj) { localStorage.setItem(STORAGE_TIMES, JSON.stringify(obj)); }

    function renderMedications() {
      const status = loadStatus();
      const times = loadTimes();
      medListDiv.innerHTML = "";

      medications.forEach((med) => {
        const isTaken = status[med.id] || false;
        const time = times[med.id] || "--:--";

        const row = document.createElement("div");
        row.className = `med-row ${isTaken ? "taken" : ""}`;
        row.id = `row-${med.id}`;

        row.innerHTML = `
          <div class="med-main">
            <div class="med-icon-box" style="background:${med.color}">
              ${med.icon}
            </div>
            <div class="med-info">
              <strong>${med.name}</strong>
              <span>${med.instructions}</span>
            </div>
          </div>
          
          <div class="med-time-status">
            ${isTaken ? '✅ تم الساعة: ' + time : '⏳ في انتظارك'}
          </div>

          <div class="action-area">
            <button class="check-btn" onclick="toggleTaken('${med.id}')" title="تحديد كتم التناول">
              <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
            </button>
          </div>
        `;

        medListDiv.appendChild(row);
      });
    }

    function toggleTaken(id) {
      const status = loadStatus();
      const times = loadTimes();
      const newState = !status[id];
      
      status[id] = newState;
      saveStatus(status);

      const row = document.getElementById(`row-${id}`);
      row.classList.add("shake");
      setTimeout(() => row.classList.remove("shake"), 400);

      if (newState) {
        const now = new Date();
        times[id] = now.toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' });
        saveTimes(times);
        dingSound.currentTime = 0;
        dingSound.play().catch(() => {});
      } else {
        delete times[id];
        saveTimes(times);
      }

      renderMedications();
    }

    renderMedications();
  </script>

</body>
</html>
